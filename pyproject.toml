[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "computed_force_residuals"
version = "0.1.0"
description = "Machine Learning on Residuals on Computed GRF"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pandas>=2.0.0",
    "pandera>=0.17.0",
    "pydantic>=2.0.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]